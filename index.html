<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080c10;
    --surface: #0e1318;
    --surface2: #141b22;
    --surface3: #1c2530;
    --border: #1e2d3d;
    --border2: #2a3f54;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --accent3: #ff6b35;
    --warn: #ffb800;
    --danger: #ff4757;
    --text: #e8f4f8;
    --text2: #7a9ab5;
    --text3: #3d5a70;
  }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; background: var(--bg); font-family: 'Outfit', sans-serif; color: var(--text); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  /* SIDEBAR */
  #sidebar {
    width: 256px; min-width: 256px; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .sidebar-header { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-logo { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; }
  .sidebar-sub { font-size: 11px; color: var(--text3); margin-top: 3px; letter-spacing: 0.08em; }
  .sidebar-search { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-search input {
    width: 100%; padding: 7px 11px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; font-size: 12px; font-family: monospace;
    color: var(--text); outline: none;
  }
  nav { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .group-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text3);
    padding: 10px 10px 5px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px;
    margin-bottom: 1px; font-size: 13px;
    cursor: pointer; transition: all 0.15s;
    color: var(--text2); border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active {
    background: rgba(0,212,255,0.08);
    color: var(--accent);
    border-color: rgba(0,212,255,0.15);
  }
  .nav-item .icon { font-size: 14px; }
  .nav-item .label { flex: 1; }
  .nav-item .badge {
    font-family: monospace; font-size: 10px;
    background: var(--surface3); color: var(--text3);
    padding: 2px 7px; border-radius: 10px;
  }
  .nav-item.active .badge { color: var(--accent); }
  .sidebar-footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    font-family: monospace; font-size: 10px; color: var(--text3);
    display: flex; align-items: center; gap: 6px;
  }
  .status-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent2);
    animation: pulse 2s infinite;
  }

  /* MAIN */
  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #topbar {
    height: 58px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; flex-shrink: 0;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .breadcrumb { font-family: monospace; font-size: 12px; color: var(--text3); }
  .breadcrumb span { color: var(--accent); }
  .endpoint-badge {
    font-family: monospace; font-size: 11px;
    background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2);
    color: var(--accent); padding: 3px 10px; border-radius: 6px;
  }
  .topbar-right { display: flex; gap: 8px; }
  .btn-refresh {
    padding: 6px 14px; border-radius: 8px; font-size: 12px;
    background: transparent; border: 1px solid var(--border2);
    color: var(--text2); cursor: pointer; transition: all 0.2s;
  }
  .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
  .btn-add {
    padding: 6px 16px; border-radius: 8px; font-size: 12px; font-weight: 600;
    background: var(--accent); color: var(--bg); border: none; cursor: pointer;
  }
  .btn-add:hover { opacity: 0.9; }

  /* CONTENT */
  #content { flex: 1; overflow-y: auto; padding: 22px; }

  /* WELCOME */
  #welcome {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 70vh; animation: fadeUp 0.4s ease;
  }
  .welcome-title { font-family: monospace; font-size: 36px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 8px; }
  .welcome-sub { font-size: 15px; color: var(--text2); margin-bottom: 36px; }
  .module-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 760px; width: 100%; }
  .module-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; cursor: pointer;
    transition: all 0.2s;
  }
  .module-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .module-card .mod-icon { font-size: 20px; margin-bottom: 8px; }
  .module-card .mod-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .module-card .mod-ep { font-family: monospace; font-size: 10px; color: var(--text3); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; position: relative; overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }
  .stat-top { position: absolute; top: 0; left: 0; right: 0; height: 2px; }
  .stat-label { font-size: 10px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-family: monospace; font-weight: 700; line-height: 1; margin-bottom: 4px; }
  .stat-sub { font-size: 11px; color: var(--text3); }

  /* TABLE */
  .table-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 18px; overflow: hidden;
    animation: fadeUp 0.4s ease 0.1s both;
  }
  .table-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .table-title { font-size: 14px; font-weight: 600; }
  .btn-icon {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-family: monospace; font-size: 10px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3);
    padding: 10px 18px; text-align: left;
    border-bottom: 1px solid var(--border);
    background: var(--surface); white-space: nowrap;
  }
  tbody tr:hover td { background: rgba(255,255,255,0.02); }
  tbody td {
    padding: 12px 18px; font-size: 13px; color: var(--text2);
    border-bottom: 1px solid rgba(30,45,61,0.5);
    max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .id-badge {
    font-family: monospace; font-size: 11px;
    background: var(--surface2); color: var(--text3);
    padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border);
  }
  .action-group { display: flex; gap: 6px; }
  .btn-edit {
    padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
    background: rgba(0,212,255,0.1); color: var(--accent);
    border: 1px solid rgba(0,212,255,0.2); cursor: pointer; transition: opacity 0.15s;
  }
  .btn-edit:hover { opacity: 0.85; }
  .btn-del {
    padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
    background: rgba(255,71,87,0.1); color: var(--danger);
    border: 1px solid rgba(255,71,87,0.2); cursor: pointer; transition: opacity 0.15s;
  }
  .btn-del:hover { opacity: 0.85; }
  .empty-row td { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }
  .loading-td { text-align: center; padding: 36px; }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  /* ADD FORM */
  .form-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; animation: fadeUp 0.3s ease;
  }
  .form-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600;
  }
  .form-close { font-family: monospace; font-size: 11px; color: var(--text3); cursor: pointer; }
  .form-body { padding: 20px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .field-label {
    display: block; font-family: monospace; font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text3); margin-bottom: 6px;
  }
  .field-input {
    width: 100%; padding: 9px 12px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; font-family: monospace;
    color: var(--text); outline: none;
  }
  .field-input:focus { border-color: var(--accent); }
  .form-actions { display: flex; gap: 10px; }
  .btn-create {
    padding: 9px 22px; background: var(--accent); color: var(--bg);
    border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-create:hover { opacity: 0.9; }
  .btn-clear {
    padding: 9px 16px; background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; color: var(--text3); cursor: pointer;
  }

  /* MODAL */
  #modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px); z-index: 1000;
    display: none; align-items: center; justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 16px; padding: 28px; width: 500px; max-width: 95vw;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .modal-id { color: var(--text3); font-size: 13px; margin-left: 6px; }
  .modal-close {
    width: 28px; height: 28px; border-radius: 7px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text2); cursor: pointer; font-size: 14px;
  }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel {
    padding: 9px 16px; background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12px; color: var(--text3); cursor: pointer;
  }
  .btn-save {
    padding: 9px 22px; background: var(--accent); color: var(--bg);
    border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-save:hover { opacity: 0.9; }

  /* TOASTS */
  #toasts {
    position: fixed; bottom: 24px; right: 24px;
    display: flex; flex-direction: column; gap: 8px; z-index: 9999;
  }
  .toast {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 12px 16px; min-width: 260px;
    font-family: monospace; font-size: 13px; color: var(--text);
    animation: slideIn 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .toast-bar { width: 3px; height: 32px; border-radius: 3px; flex-shrink: 0; }
  .toast-type { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }

  @keyframes slideIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* LOGIN */
  #login-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9000; animation: fadeUp 0.4s ease;
  }
  #login-screen.hidden { display: none; }
  .login-box {
    width: 380px; background: var(--surface);
    border: 1px solid var(--border2); border-radius: 18px;
    padding: 40px 36px; position: relative; overflow: hidden;
  }
  .login-box::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .login-logo {
    font-family: 'JetBrains Mono', monospace; font-size: 24px;
    font-weight: 700; color: var(--accent); letter-spacing: 0.1em;
    text-align: center; margin-bottom: 6px;
  }
  .login-sub { font-size: 12px; color: var(--text3); text-align: center; margin-bottom: 32px; letter-spacing: 0.06em; }
  .login-field { margin-bottom: 16px; }
  .login-label {
    display: block; font-family: monospace; font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text3); margin-bottom: 8px;
  }
  .login-input {
    width: 100%; padding: 11px 14px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 9px; font-size: 14px; font-family: monospace;
    color: var(--text); outline: none; transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 12px;
    background: var(--accent); color: var(--bg);
    border: none; border-radius: 9px;
    font-size: 14px; font-weight: 600; font-family: 'Outfit', sans-serif;
    cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
    letter-spacing: 0.04em;
  }
  .login-btn:hover { opacity: 0.88; }
  .login-error {
    background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.25);
    color: var(--danger); border-radius: 8px;
    padding: 10px 14px; font-size: 12px; font-family: monospace;
    margin-bottom: 16px; display: none; text-align: center;
  }
  .login-error.show { display: block; }
  .login-hint {
    text-align: center; margin-top: 20px;
    font-family: monospace; font-size: 11px; color: var(--text3);
  }
  .login-hint span { color: var(--text2); }

  /* LOGOUT btn */
  .btn-logout {
    padding: 6px 14px; border-radius: 8px; font-size: 12px;
    background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.2);
    color: var(--danger); cursor: pointer; transition: all 0.2s;
  }
  .btn-logout:hover { background: rgba(255,71,87,0.15); }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">&#x2B21; VIBE</div>
    <div class="login-sub">Admin Dashboard &middot; Kirish</div>
    <div class="login-error" id="login-error">Username yoki password noto&#x2019;g&#x2019;ri</div>
    <div class="login-field">
      <label class="login-label">Username</label>
      <input class="login-input" type="text" id="login-username" placeholder="username" autocomplete="username">
    </div>
    <div class="login-field">
      <label class="login-label">Password</label>
      <input class="login-input" type="password" id="login-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doLogin()">Kirish</button>
    <div class="login-hint">user: <span>user</span> &nbsp;&middot;&nbsp; pass: <span>user123</span></div>
  </div>
</div>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">⬡ VIBE</div>
    <div class="sidebar-sub">Admin Dashboard</div>
  </div>
  <div class="sidebar-search">
    <input type="text" id="search-input" placeholder="/ search..." oninput="filterNav(this.value)">
  </div>
  <nav id="nav"></nav>
  <div class="sidebar-footer">
    <span class="status-dot"></span>
    localhost:8000 · Ready
  </div>
</aside>

<!-- MAIN -->
<main id="main">
  <div id="topbar">
    <div class="topbar-left">
      <span class="breadcrumb" id="breadcrumb">admin / <span>dashboard</span></span>
      <span class="endpoint-badge" id="endpoint-badge" style="display:none"></span>
    </div>
    <div class="topbar-right">
      <button class="btn-refresh" id="btn-refresh" style="display:none" onclick="fetchData()">↻ Refresh</button>
      <button class="btn-add" id="btn-add" style="display:none" onclick="toggleForm()">+ Add New</button>
      <button class="btn-logout" id="btn-logout" style="display:none" onclick="doLogout()">Chiqish</button>
    </div>
  </div>
  <div id="content"></div>
</main>

<!-- EDIT MODAL -->
<div id="modal-overlay" onclick="modalClickOutside(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div><span class="modal-title" id="modal-title">Edit</span><span class="modal-id" id="modal-id"></span></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-grid" id="modal-fields"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div id="toasts"></div>

<script>
const MODULES = [
  { key:"products", label:"Products", icon:"📦", endpoint:"/products", group:"Core",
    fields:[{k:"name",l:"Name"},{k:"details",l:"Details"},{k:"price",l:"Price",t:"number"},{k:"brand_id",l:"Brand ID",t:"number"},{k:"sub_category_id",l:"Sub Cat ID",t:"number"}]},
  { key:"users", label:"Users", icon:"👤", endpoint:"/users", group:"Core",
    fields:[{k:"username",l:"Username"},{k:"email",l:"Email"},{k:"phone",l:"Phone"},{k:"password",l:"Password"}]},
  { key:"categories", label:"Categories", icon:"🗂️", endpoint:"/categories", group:"Core",
    fields:[{k:"name",l:"Name"},{k:"image",l:"Image URL"}]},
  { key:"sub-categories", label:"Sub Categories", icon:"📁", endpoint:"/sub-categories", group:"Core",
    fields:[{k:"name",l:"Name"},{k:"image",l:"Image URL"},{k:"category_id",l:"Category ID",t:"number"}]},
  { key:"brands", label:"Brands", icon:"🏷️", endpoint:"/brands", group:"Core",
    fields:[{k:"name",l:"Name"},{k:"image",l:"Image URL"}]},
  { key:"orders", label:"Orders", icon:"📋", endpoint:"/orders", group:"Commerce",
    fields:[{k:"user_id",l:"User ID",t:"number"},{k:"total_price",l:"Total",t:"number"},{k:"status",l:"Status"},{k:"address",l:"Address"}]},
  { key:"order-items", label:"Order Items", icon:"🧾", endpoint:"/order-items", group:"Commerce",
    fields:[{k:"order_id",l:"Order ID",t:"number"},{k:"product_id",l:"Product ID",t:"number"},{k:"quantity",l:"Qty",t:"number"},{k:"price",l:"Price",t:"number"}]},
  { key:"cart-items", label:"Cart Items", icon:"🛒", endpoint:"/cart-items", group:"Commerce",
    fields:[{k:"user_id",l:"User ID",t:"number"},{k:"product_id",l:"Product ID",t:"number"},{k:"quantity",l:"Qty",t:"number"}]},
  { key:"favorites", label:"Favorites", icon:"❤️", endpoint:"/favorites", group:"Commerce",
    fields:[{k:"user_id",l:"User ID",t:"number"},{k:"product_id",l:"Product ID",t:"number"}]},
  { key:"reviews", label:"Reviews", icon:"⭐", endpoint:"/reviews", group:"Commerce",
    fields:[{k:"user_id",l:"User ID",t:"number"},{k:"product_id",l:"Product ID",t:"number"},{k:"rating",l:"Rating",t:"number"},{k:"comment",l:"Comment"}]},
  { key:"discounts", label:"Discounts", icon:"💸", endpoint:"/discounts", group:"Marketing",
    fields:[{k:"code",l:"Code"},{k:"percent",l:"Percent",t:"number"},{k:"product_id",l:"Product ID",t:"number"}]},
  { key:"ad-banners", label:"Ad Banners", icon:"📢", endpoint:"/ad-banners", group:"Marketing",
    fields:[{k:"title",l:"Title"},{k:"image",l:"Image URL"},{k:"link",l:"Link URL"}]},
  { key:"notifications", label:"Notifications", icon:"🔔", endpoint:"/notifications", group:"Marketing",
    fields:[{k:"user_id",l:"User ID",t:"number"},{k:"title",l:"Title"},{k:"message",l:"Message"}]},
  { key:"images", label:"Images", icon:"🖼️", endpoint:"/images", group:"System",
    fields:[{k:"url",l:"URL"},{k:"product_id",l:"Product ID",t:"number"}]},
  { key:"properties", label:"Properties", icon:"🔧", endpoint:"/properties", group:"System",
    fields:[{k:"name",l:"Name"},{k:"value",l:"Value"},{k:"product_id",l:"Product ID",t:"number"}]},
  { key:"variant-options", label:"Variant Options", icon:"🎛️", endpoint:"/variant-options", group:"System",
    fields:[{k:"name",l:"Name"},{k:"value",l:"Value"},{k:"product_id",l:"Product ID",t:"number"}]},
];
const GROUPS = ["Core","Commerce","Marketing","System"];

let current = null;
let items = [];
let counts = {};
let showForm = false;
let newItem = {};
let editItemData = null;
let toastCounter = 0;

function getMod() { return MODULES.find(m => m.key === current) || null; }

function makeMock(mod) {
  return Array.from({length:3}, (_,i) => {
    const obj = {id: i+1};
    mod.fields.forEach(f => { obj[f.k] = f.t === "number" ? Math.floor(Math.random()*50)+1 : `sample_${f.k}`; });
    return obj;
  });
}

function trunc(v, n=25) {
  if(v == null) return "—";
  const s = String(v);
  return s.length > n ? s.slice(0, n) + "…" : s;
}

// NAV
function renderNav(filter="") {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  GROUPS.forEach(g => {
    const mods = MODULES.filter(m => m.group === g && (!filter || m.label.toLowerCase().includes(filter.toLowerCase()) || m.endpoint.includes(filter.toLowerCase())));
    if(!mods.length) return;
    const groupDiv = document.createElement("div");
    groupDiv.innerHTML = `<div class="group-label">${g}</div>`;
    mods.forEach(m => {
      const div = document.createElement("div");
      div.className = "nav-item" + (current === m.key ? " active" : "");
      div.innerHTML = `<span class="icon">${m.icon}</span><span class="label">${m.label}</span><span class="badge">${counts[m.key] ?? "—"}</span>`;
      div.onclick = () => selectModule(m.key);
      groupDiv.appendChild(div);
    });
    nav.appendChild(groupDiv);
  });
}

function filterNav(val) { renderNav(val); }

function selectModule(key) {
  current = key;
  showForm = false;
  newItem = {};
  editItemData = null;
  renderNav(document.getElementById("search-input").value);
  updateTopbar();
  fetchData();
}

function updateTopbar() {
  const mod = getMod();
  const bc = document.getElementById("breadcrumb");
  const ep = document.getElementById("endpoint-badge");
  const btnR = document.getElementById("btn-refresh");
  const btnA = document.getElementById("btn-add");
  if(mod) {
    bc.innerHTML = `admin / <span>${mod.label}</span>`;
    ep.textContent = mod.endpoint;
    ep.style.display = "";
    btnR.style.display = "";
    btnA.style.display = "";
  } else {
    bc.innerHTML = `admin / <span>dashboard</span>`;
    ep.style.display = "none";
    btnR.style.display = "none";
    btnA.style.display = "none";
  }
}

function toggleForm() {
  showForm = !showForm;
  renderContent();
}

// FETCH
async function fetchData() {
  const mod = getMod();
  if(!mod) return;
  renderLoading();
  try {
    const r = await fetch(mod.endpoint);
    if(r.ok) { items = await r.json(); }
    else { items = makeMock(mod); }
  } catch { items = makeMock(mod); }
  counts[current] = items.length;
  renderNav(document.getElementById("search-input").value);
  renderContent();
}

function renderLoading() {
  const mod = getMod();
  if(!mod) return;
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="stats-grid">${renderStats(mod)}</div>
    <div class="table-card">
      <div class="table-header">
        <span class="table-title">${mod.label} Records</span>
        <button class="btn-icon" onclick="fetchData()">↻</button>
      </div>
      <div class="table-wrap"><table><thead>${renderThead(mod)}</thead><tbody><tr><td class="loading-td" colspan="${mod.fields.length+2}"><div class="spinner"></div></td></tr></tbody></table></div>
    </div>`;
}

function renderStats(mod) {
  const stats = [
    {l:"Total Records", v:items.length||"…", c:"var(--accent)", sub:mod.label, big:true},
    {l:"Endpoint", v:mod.endpoint, c:"var(--accent2)", sub:"GET · POST · PUT · DELETE", small:true},
    {l:"Status", v:"200 OK", c:"var(--accent3)", sub:"API Connected", big:true},
    {l:"Fields", v:mod.fields.length, c:"var(--warn)", sub:"Schema fields", big:true},
  ];
  return stats.map((s,i) => `
    <div class="stat-card" style="animation-delay:${i*0.05}s">
      <div class="stat-top" style="background:${s.c}"></div>
      <div class="stat-label">${s.l}</div>
      <div class="stat-value" style="font-size:${s.small?13:26}px;color:${s.c}">${s.v}</div>
      <div class="stat-sub">${s.sub}</div>
    </div>`).join("");
}

function renderThead(mod) {
  return `<tr><th>ID</th>${mod.fields.map(f=>`<th>${f.l}</th>`).join("")}<th>Actions</th></tr>`;
}

function renderContent() {
  const mod = getMod();
  const content = document.getElementById("content");
  if(!mod) {
    content.innerHTML = `
      <div id="welcome">
        <div class="welcome-title">VIBE ADMIN</div>
        <div class="welcome-sub">16 ta router — hammasi bir joyda</div>
        <div class="module-grid">
          ${MODULES.map(m=>`
            <div class="module-card" onclick="selectModule('${m.key}')">
              <div class="mod-icon">${m.icon}</div>
              <div class="mod-name">${m.label}</div>
              <div class="mod-ep">${m.endpoint}</div>
            </div>`).join("")}
        </div>
      </div>`;
    return;
  }

  const rows = items.length === 0
    ? `<tr class="empty-row"><td colspan="${mod.fields.length+2}">No records. Add your first ${mod.label} below.</td></tr>`
    : items.map((item,ri) => `
        <tr class="row-hover" style="animation: fadeUp 0.3s ease ${ri*0.03}s both">
          <td><span class="id-badge">#${item.id}</span></td>
          ${mod.fields.map(f=>`<td title="${item[f.k]??""}">${trunc(item[f.k])}</td>`).join("")}
          <td>
            <div class="action-group">
              <button class="btn-edit" onclick="openEdit(${item.id})">Edit</button>
              <button class="btn-del" onclick="deleteItem(${item.id})">Del</button>
            </div>
          </td>
        </tr>`).join("");

  const formHtml = showForm ? `
    <div class="form-card">
      <div class="form-header">
        <span>+ Add New ${mod.label}</span>
        <span class="form-close" onclick="toggleForm()">✕ Close</span>
      </div>
      <div class="form-body">
        <div class="form-grid">
          ${mod.fields.map(f=>`
            <div>
              <label class="field-label">${f.l}</label>
              <input class="field-input" type="${f.t==="number"?"number":"text"}"
                placeholder="${f.l}" id="new_${f.k}"
                value="${newItem[f.k]||""}">
            </div>`).join("")}
        </div>
        <div class="form-actions">
          <button class="btn-create" onclick="createItem()">Create ${mod.label}</button>
          <button class="btn-clear" onclick="clearForm()">Clear</button>
        </div>
      </div>
    </div>` : "";

  content.innerHTML = `
    <div class="stats-grid">${renderStats(mod)}</div>
    <div class="table-card">
      <div class="table-header">
        <span class="table-title">${mod.label} Records</span>
        <button class="btn-icon" onclick="fetchData()">↻</button>
      </div>
      <div class="table-wrap">
        <table><thead>${renderThead(mod)}</thead><tbody>${rows}</tbody></table>
      </div>
    </div>
    ${formHtml}`;
}

// CREATE
async function createItem() {
  const mod = getMod();
  if(!mod) return;
  const data = {};
  mod.fields.forEach(f => {
    const val = document.getElementById(`new_${f.k}`)?.value || "";
    data[f.k] = f.t === "number" ? Number(val) : val;
  });
  try {
    const r = await fetch(mod.endpoint, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    const d = r.ok ? await r.json() : {...data, id: Date.now()};
    items.push(d);
    counts[current] = items.length;
    toast("success", `${mod.label} created!`);
  } catch {
    items.push({...data, id: Date.now()});
    counts[current] = items.length;
    toast("success", "Added (offline mode)");
  }
  newItem = {};
  showForm = false;
  renderNav(document.getElementById("search-input").value);
  renderContent();
}

function clearForm() {
  const mod = getMod();
  if(!mod) return;
  mod.fields.forEach(f => {
    const el = document.getElementById(`new_${f.k}`);
    if(el) el.value = "";
  });
  newItem = {};
}

// DELETE
async function deleteItem(id) {
  if(!confirm("Delete this record?")) return;
  const mod = getMod();
  try { await fetch(`${mod.endpoint}/${id}`, {method:"DELETE"}); } catch {}
  items = items.filter(x => x.id !== id);
  counts[current] = Math.max(0, items.length);
  toast("error", "Record deleted");
  renderNav(document.getElementById("search-input").value);
  renderContent();
}

// EDIT MODAL
function openEdit(id) {
  const mod = getMod();
  editItemData = {...items.find(x => x.id === id)};
  document.getElementById("modal-title").textContent = `Edit ${mod.label}`;
  document.getElementById("modal-id").textContent = `#${id}`;
  const fieldsDiv = document.getElementById("modal-fields");
  fieldsDiv.innerHTML = mod.fields.map(f=>`
    <div>
      <label class="field-label">${f.l}</label>
      <input class="field-input" type="${f.t==="number"?"number":"text"}"
        id="edit_${f.k}" value="${editItemData[f.k]??""}" style="width:100%">
    </div>`).join("");
  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
  editItemData = null;
}

function modalClickOutside(e) {
  if(e.target === document.getElementById("modal-overlay")) closeModal();
}

async function saveEdit() {
  const mod = getMod();
  if(!editItemData) return;
  mod.fields.forEach(f => {
    const val = document.getElementById(`edit_${f.k}`)?.value || "";
    editItemData[f.k] = f.t === "number" ? Number(val) : val;
  });
  try {
    await fetch(`${mod.endpoint}/${editItemData.id}`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(editItemData)});
  } catch {}
  items = items.map(x => x.id === editItemData.id ? editItemData : x);
  toast("success", "Record updated!");
  closeModal();
  renderContent();
}

// TOAST
function toast(type, msg) {
  const id = ++toastCounter;
  const bar = type === "success" ? "var(--accent2)" : type === "error" ? "var(--danger)" : "var(--accent)";
  const div = document.createElement("div");
  div.className = "toast";
  div.id = `toast-${id}`;
  div.innerHTML = `
    <div class="toast-bar" style="background:${bar}"></div>
    <div>
      <div class="toast-type">${type}</div>
      ${msg}
    </div>`;
  document.getElementById("toasts").appendChild(div);
  setTimeout(() => div.remove(), 3000);
}


// AUTH
const CREDENTIALS = { username: "user", password: "user123" };

function doLogin() {
  const u = document.getElementById("login-username").value.trim();
  const p = document.getElementById("login-password").value;
  const err = document.getElementById("login-error");
  if(u === CREDENTIALS.username && p === CREDENTIALS.password) {
    err.classList.remove("show");
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("btn-logout").style.display = "";
    toast("success", "Xush kelibsiz, " + u + "!");
  } else {
    err.classList.add("show");
    document.getElementById("login-password").value = "";
  }
}

function doLogout() {
  document.getElementById("login-screen").classList.remove("hidden");
  document.getElementById("btn-logout").style.display = "none";
  document.getElementById("login-username").value = "";
  document.getElementById("login-password").value = "";
  document.getElementById("login-error").classList.remove("show");
}

document.addEventListener("keydown", function(e) {
  if(e.key === "Enter" && !document.getElementById("login-screen").classList.contains("hidden")) {
    doLogin();
  }
});

// INIT
renderNav();
renderContent();
</script>
</body>
</html>
